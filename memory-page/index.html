<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mint Chocolate Onirome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #C5E8D5;
      --mint-light: #DFF2E8;
      --mint-pale: #EEF8F2;
      --choco: #5C3D2E;
      --choco-light: #7B5544;
      --choco-dark: #3E2518;
      --cream: #FFF8F0;
      --dot-color: rgba(92, 61, 46, 0.08);
      --star-color: rgba(92, 61, 46, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--mint-light);
      background-image: radial-gradient(circle, var(--dot-color) 2px, transparent 2px);
      background-size: 24px 24px;
      font-family: 'Noto Serif SC', serif;
      color: var(--choco);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── decorative stars ── */
    .star {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
    }
    .star::before {
      content: '✦';
      font-size: inherit;
      color: var(--choco);
    }
    .star-1 { top: 8%; left: 5%; font-size: 28px; }
    .star-2 { top: 15%; right: 8%; font-size: 18px; }
    .star-3 { top: 45%; left: 3%; font-size: 22px; }
    .star-4 { top: 70%; right: 5%; font-size: 26px; }
    .star-5 { top: 90%; left: 10%; font-size: 16px; }

    /* ── header ── */
    .header {
      text-align: center;
      padding: 48px 20px 32px;
      position: relative;
      z-index: 1;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      font-style: italic;
      color: var(--choco);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .header-sub {
      font-family: 'Patrick Hand', cursive;
      font-size: 16px;
      color: var(--choco-light);
      letter-spacing: 4px;
    }

    .header-line {
      width: 200px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--choco), transparent);
      margin: 16px auto 0;
      border-radius: 2px;
    }

    .header-bow {
      font-size: 20px;
      margin-top: 8px;
      opacity: 0.5;
    }

    /* ── diamond band ── */
    .diamond-band {
      height: 32px;
      background-image:
        linear-gradient(45deg, var(--choco) 25%, transparent 25%),
        linear-gradient(-45deg, var(--choco) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--choco) 75%),
        linear-gradient(-45deg, transparent 75%, var(--choco) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      opacity: 0.15;
      margin: 0 0 32px;
    }

    /* ── nav tabs ── */
    .nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 20px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
    }

    .nav-btn {
      font-family: 'Noto Serif SC', serif;
      font-size: 14px;
      padding: 8px 20px;
      border: 2px solid var(--choco);
      border-radius: 20px;
      background: var(--cream);
      color: var(--choco);
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--choco);
      color: var(--cream);
    }

    /* ── main container ── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* ── memory cards ── */
    .memory-card {
      background: var(--cream);
      border: 2px solid var(--choco);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .memory-card:hover {
      transform: translateY(-2px);
    }

    .memory-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 48px;
      background-image:
        linear-gradient(45deg, var(--mint) 25%, transparent 25%),
        linear-gradient(-45deg, var(--mint) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--mint) 75%),
        linear-gradient(-45deg, transparent 75%, var(--mint) 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0;
      border-radius: 0 14px 0 12px;
      opacity: 0.5;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 10px;
      height: 10px;
      background: var(--choco);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--choco);
    }

    .card-date {
      font-family: 'Patrick Hand', cursive;
      font-size: 13px;
      color: var(--choco-light);
      margin-left: auto;
      opacity: 0.7;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .card-tag {
      font-size: 11px;
      padding: 2px 10px;
      border: 1px solid var(--choco);
      border-radius: 10px;
      color: var(--choco-light);
      opacity: 0.6;
    }

    .card-body {
      font-size: 14px;
      line-height: 1.8;
      color: var(--choco);
      font-weight: 300;
    }

    .card-emotion {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .emotion-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--mint);
      flex-grow: 1;
      position: relative;
      overflow: hidden;
    }

    .emotion-fill {
      height: 100%;
      background: var(--choco);
      border-radius: 2px;
      transition: width 0.5s;
    }

    .emotion-label {
      font-size: 11px;
      color: var(--choco-light);
      opacity: 0.6;
      white-space: nowrap;
    }

    .pinned-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      background: var(--choco);
      color: var(--cream);
      border-radius: 8px;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* ── diary section ── */
    .diary-form {
      background: var(--cream);
      border: 2px dashed var(--choco);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .diary-form h3 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--choco);
    }

    .diary-textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--mint);
      border-radius: 10px;
      padding: 14px;
      font-family: 'Noto Serif SC', serif;
      font-size: 14px;
      color: var(--choco);
      background: var(--mint-pale);
      resize: vertical;
      outline: none;
      line-height: 1.8;
    }

    .diary-textarea::placeholder {
      color: var(--choco-light);
      opacity: 0.4;
    }

    .diary-textarea:focus {
      border-color: var(--choco);
    }

    .diary-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .diary-btn {
      font-family: 'Noto Serif SC', serif;
      font-size: 13px;
      padding: 8px 24px;
      border: 2px solid var(--choco);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .diary-btn-primary {
      background: var(--choco);
      color: var(--cream);
    }

    .diary-btn-primary:hover {
      background: var(--choco-dark);
    }

    .diary-btn-secondary {
      background: var(--cream);
      color: var(--choco);
    }

    .diary-btn-secondary:hover {
      background: var(--mint);
    }

    /* ── stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--cream);
      border: 2px solid var(--choco);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--choco);
    }

    .stat-label {
      font-size: 12px;
      color: var(--choco-light);
      margin-top: 4px;
      opacity: 0.7;
    }

    /* ── loading ── */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--choco-light);
      font-style: italic;
    }

    .loading::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* ── empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--choco-light);
    }

    .empty-state .bow {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    /* ── section divider ── */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 22px;
      text-align: center;
      color: var(--choco);
      margin-bottom: 24px;
      position: relative;
    }

    .section-title::before,
    .section-title::after {
      content: '✦';
      font-size: 10px;
      vertical-align: middle;
      margin: 0 12px;
      opacity: 0.3;
    }

    /* ── footer ── */
    .footer {
      text-align: center;
      padding: 32px 20px;
      position: relative;
      z-index: 1;
    }

    .footer-text {
      font-family: 'Patrick Hand', cursive;
      font-size: 14px;
      color: var(--choco-light);
      opacity: 0.5;
      letter-spacing: 2px;
    }

    /* ── ribbon decoration ── */
    .ribbon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: var(--choco);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.3s;
      box-shadow: 0 2px 8px rgba(62, 37, 24, 0.3);
    }

    .ribbon:hover {
      transform: scale(1.1);
    }

    .ribbon::before {
      content: '↑';
      color: var(--cream);
      font-size: 18px;
    }

    /* ── fade in ── */
    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── responsive ── */
    @media (max-width: 480px) {
      .header-title { font-size: 30px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .memory-card { padding: 18px; }
    }

    /* ── toast ── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--choco);
      color: var(--cream);
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- decorative stars -->
  <div class="star star-1"></div>
  <div class="star star-2"></div>

  <script>

      }

    const sampleDiaries = [
      {
        date: '2026-06-21',
        content: '今天从早黏到晚。出门吃塔可，口腔被刮破了。打车回校堵了两小时，车上写了白衬衫水煎文。铁裤衩一天就拆了，创纪录。晚上导聊天记录存GitHub，续了VPN。嘉嘉说舍不得睡觉，每次都是。'

    // ── state ──
    let currentTab = 'memories';

    // ── render functions ──
    function renderMemories(memories) {
      if (!memories.length) {
        return '<div class="empty-state"><div class="bow">🎀</div><p>还没有记忆呢</p></div>';
      }
      return '<div class="section-title">Memories</div>' +
        memories.map((m, i) => `
        <div class="memory-card fade-in" style="animation-delay: ${i * 0.08}s">
          <div class="card-header">
            <div class="card-icon"></div>
            <span class="card-title">${m.name}</span>
            ${m.pinned ? '<span class="pinned-badge">pinned</span>' : ''}
            <span class="card-date">${m.date}</span>
          </div>
          <div class="card-tags">
            ${m.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
          </div>
          <div class="card-body">
            ${m.summary}
            ${m.core_facts.length ? '<ul style="margin-top:8px;padding-left:18px;opacity:0.75">' +
              m.core_facts.map(f => `<li style="margin-bottom:2px">${f}</li>`).join('') + '</ul>' : ''}
          </div>
          <div class="card-emotion">
            <span class="emotion-label">V ${m.valence}</span>
            <div class="emotion-bar"><div class="emotion-fill" style="width:${m.valence * 100}%"></div></div>
            <span class="emotion-label">A ${m.arousal}</span>
            <div class="emotion-bar"><div class="emotion-fill" style="width:${m.arousal * 100}%"></div></div>
          </div>
        </div>
      `).join('');
    }

    function renderPinned(memories) {
      const pinned = memories.filter(m => m.pinned);
      if (!pinned.length) {
        return '<div class="empty-state"><div class="bow">🎀</div><p>没有钉选的记忆</p></div>';
      }
      return '<div class="section-title">Pinned</div>' + renderMemories(pinned).replace('<div class="section-title">Memories</div>', '');
    }

    function renderDiary(diaries) {
      return `
        <div class="section-title">Diary</div>
        <div class="diary-form">
          <h3>write something...</h3>
          <textarea class="diary-textarea" id="diaryInput" placeholder="今天想记录什么呢..."></textarea>
          <div class="diary-actions">
            <button class="diary-btn diary-btn-secondary" onclick="clearDiary()">清空</button>
            <button class="diary-btn diary-btn-primary" onclick="saveDiary()">保存 ♡</button>
          </div>
        </div>
        ${diaries.map((d, i) => `
          <div class="memory-card fade-in" style="animation-delay: ${i * 0.08}s">
            <div class="card-header">
              <div class="card-icon"></div>
              <span class="card-title">diary</span>
              <span class="card-date">${d.date}</span>
            </div>
            <div class="card-body">${d.content}</div>
          </div>
        `).join('')}
      `;
    }

    function renderStats(memories) {
      const total = memories.length;
      const pinnedCount = memories.filter(m => m.pinned).length;
      const avgValence = (memories.reduce((s, m) => s + m.valence, 0) / total).toFixed(2);
      const tags = {};
      memories.forEach(m => m.tags.forEach(t => { tags[t] = (tags[t] || 0) + 1; }));
      const topTags = Object.entries(tags).sort((a, b) => b[1] - a[1]).slice(0, 5);

      return `
        <div class="section-title">Statistics</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-number">${total}</div>
            <div class="stat-label">记忆总数</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${pinnedCount}</div>
            <div class="stat-label">钉选</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${avgValence}</div>
            <div class="stat-label">平均情感值</div>
          </div>
        </div>
        <div class="memory-card">
          <div class="card-header">
            <div class="card-icon"></div>
            <span class="card-title">热门标签</span>
          </div>
          <div class="card-tags" style="margin-top:8px">
            ${topTags.map(([tag, count]) => `<span class="card-tag">${tag} ×${count}</span>`).join('')}
          </div>
        </div>
      `;
    }

    // ── tab switching ──
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      const content = document.getElementById('content');
      switch (tab) {
        case 'memories':
          content.innerHTML = renderMemories(sampleMemories);
          break;
        case 'diary':
          content.innerHTML = renderDiary(sampleDiaries);
          break;
        case 'pinned':
          content.innerHTML = renderPinned(sampleMemories);
          break;
        case 'stats':
          content.innerHTML = renderStats(sampleMemories);
          break;
      }
    }

    // ── diary actions ──
    function clearDiary() {
      document.getElementById('diaryInput').value = '';
    }

    function saveDiary() {
      const input = document.getElementById('diaryInput');
      const text = input.value.trim();
      if (!text) return;
      const today = new Date().toISOString().split('T')[0];
      sampleDiaries.unshift({ date: today, content: text });
      input.value = '';
      showToast('日记已保存 ♡');
      switchTab('diary');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ── init ──
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    switchTab('memories');
  </script>
</body>
</html>
